<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0A111E"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="apple-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#9E00FF"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Glassmorphic Card Container -->
  <rect x="70" y="45" width="1060" height="330" rx="24" fill="url(#card-grad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Apple Logo -->
  <g transform="translate(130, 85) scale(0.48)">
    <path fill="#F5F5F7" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.58-7.7-11.64-13.99-5.99-9.35-10.6-19.67-13.82-30.98-3.23-11.31-4.84-21.98-4.84-32 0-15.65 4.15-28.71 12.44-39.18 8.3-10.47 18.66-15.82 31.09-16.06 4.79 0 10.15 1.25 16.08 3.75 5.93 2.5 9.77 3.86 11.53 4.09 2.08-.34 6.06-1.76 11.95-4.25 5.89-2.5 11.03-3.64 15.42-3.42 12.24.62 22.34 5.37 30.3 14.25-10.74 6.5-16.01 15.49-15.82 26.97.19 9.38 3.79 17.27 10.8 23.68 7.01 6.41 15.34 10.11 25 11.1-2.22 6.54-4.89 13.06-8.01 19.56zM119.22 31.84c0-7.37 2.65-14.19 7.95-20.46 5.3-6.27 11.75-10.18 19.36-11.38.1 1.04.15 2.08.15 3.12 0 7.37-2.73 14.28-8.19 20.73-5.46 6.45-12.01 10.23-19.65 11.34-.1-.94-.15-1.98-.15-3.35z"/>
  </g>

  <!-- Tagline Badge -->
  <rect x="235" y="86" width="190" height="28" rx="14" fill="#0071E3" fill-opacity="0.2" stroke="#2997FF" stroke-opacity="0.4"/>
  <text x="330" y="105" fill="#2997FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" text-anchor="middle">OFFICIAL DocC JSON API</text>

  <!-- Title -->
  <text x="235" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Apple HIG Live</text>

  <!-- Subtitle -->
  <text x="235" y="205" fill="#A1A1A6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="19" font-weight="400">
    Teach AI coding agents the complete Human Interface Guidelines &amp; SF Symbols — live from Apple.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(235, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="18" cy="17" r="4" fill="#34C759"/>
    <text x="75" y="22" fill="#E5E5EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">iOS 18 Ready</text>

    <!-- Pill 2 -->
    <rect x="142" y="0" width="130" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="160" cy="17" r="4" fill="#2997FF"/>
    <text x="217" y="22" fill="#E5E5EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Liquid Glass</text>

    <!-- Pill 3 -->
    <rect x="284" y="0" width="145" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="302" cy="17" r="4" fill="#AF52DE"/>
    <text x="366" y="22" fill="#E5E5EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Antigravity 2.0</text>

    <!-- Pill 4 -->
    <rect x="441" y="0" width="135" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="459" cy="17" r="4" fill="#FF9500"/>
    <text x="518" y="22" fill="#E5E5EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Claude Code</text>

    <!-- Pill 5 -->
    <rect x="588" y="0" width="140" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="606" cy="17" r="4" fill="#30B0C7"/>
    <text x="668" y="22" fill="#E5E5EA" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Zero Dep CLI</text>
  </g>

  <!-- Bottom Stats Line -->
  <g transform="translate(235, 315)">
    <text x="0" y="16" fill="#86868B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13">
      Supported Platforms: <tspan fill="#FFFFFF" font-weight="600">iOS · iPadOS · macOS · watchOS · tvOS · visionOS · Windows WPF · Web</tspan>
    </text>
  </g>
